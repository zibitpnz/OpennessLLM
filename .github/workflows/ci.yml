name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Check version
        shell: cmd
        run: run.cmd version

      - name: Run offline self-test
        shell: cmd
        run: run.cmd self-test --out .\out\self-test-ci

      - name: Upload self-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-reports
          path: out/self-test-ci
          # Only generated offline fixtures; include transaction/owner journals.
          include-hidden-files: true
          if-no-files-found: warn
